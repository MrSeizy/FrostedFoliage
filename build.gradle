plugins {
    id 'net.fabricmc.fabric-loom' version "${loom_version}"
}

base { archivesName = 'frostedfoliage' }

repositories {
    mavenCentral()
    exclusiveContent {
        forRepository { maven { url = 'https://api.modrinth.com/maven' } }
        filter { includeGroup 'maven.modrinth' }
    }
}

loom {
    splitEnvironmentSourceSets()
    mods {
        frostedfoliage {
            sourceSet sourceSets.main
            sourceSet sourceSets.client
        }
    }
}

dependencies {
    minecraft "com.mojang:minecraft:${minecraft_version}"
    implementation "net.fabricmc:fabric-loader:${loader_version}"
    implementation "net.fabricmc.fabric-api:fabric-api:${fabric_api_version}"
    clientCompileOnly "maven.modrinth:cloth-config:${cloth_config_version}"
    clientCompileOnly "maven.modrinth:modmenu:${modmenu_version}"
    testImplementation platform('org.junit:junit-bom:5.13.4')
    testImplementation 'org.junit.jupiter:junit-jupiter'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}

fabricApi {
    configureTests {
        createSourceSet = true
        modId = 'frostedfoliage-test'
        enableGameTests = false
        enableClientGameTests = true
        eula = false
    }
}

// The gametest configurations only exist once configureTests above has created the source set.
dependencies { gametestCompileOnly "maven.modrinth:iris:${iris_version}" }

def testRenderer = providers.gradleProperty('testRenderer').getOrElse('vanilla')
if (!(testRenderer in ['vanilla', 'sodium', 'iris'])) {
    throw new GradleException('testRenderer must be vanilla, sodium, or iris')
}
if (project.hasProperty('shaderPack') && testRenderer != 'iris') {
    throw new GradleException('shaderPack requires -PtestRenderer=iris')
}
if (testRenderer in ['sodium', 'iris']) {
    dependencies { gametestRuntimeOnly "maven.modrinth:sodium:${sodium_version}" }
}
if (testRenderer == 'iris') {
    dependencies { gametestRuntimeOnly "maven.modrinth:iris:${iris_version}" }
}
// Boolean -P flags for the client game tests, mapped to the frostedfoliage.test.* system properties they set.
def gameTestFlags = [
    benchmark: 'benchmark', churnTest: 'churn', verifyChurnFix: 'churn.verify', textureBudgetTest: 'textureBudget',
    reloadTest: 'reload', groundTest: 'ground', galleryCapture: 'gallery', captureTest: 'capture',
    legacyCapture: 'capture.legacy', priorityTest: 'priority', appearanceTest: 'appearance', depthTest: 'depth',
    videoCapture: 'video', timelapseCapture: 'timelapse', plantTest: 'plants', iconCapture: 'icon',
    vanillaPlants: 'vanillaPlants', treeTypesTest: 'treeTypes', leavesTest: 'leaves', rebuildTest: 'rebuild', tornTest: 'torn', flightTest: 'flight',
]
loom.runs.named('clientGameTest') {
    systemProperties.put('frostedfoliage.test.renderer', testRenderer)
    for (flag in gameTestFlags) {
        systemProperties.put("frostedfoliage.test.${flag.value}".toString(), providers.gradleProperty(flag.key).getOrElse('false'))
    }
    systemProperties.put('frostedfoliage.test.churn.label', providers.gradleProperty('churnLabel').getOrElse('current'))
    systemProperties.put('frostedfoliage.test.shaderExpected', project.hasProperty('shaderPack').toString())
}
tasks.named('runClientGameTest') {
    doFirst {
        if (project.hasProperty('shaderPack')) {
            def shader = file(project.property('shaderPack'))
            if (!shader.isFile()) throw new GradleException("Shader pack not found: ${shader}")
            def directory = file('build/run/clientGameTest')
            copy { from shader; into new File(directory, 'shaderpacks') }
            def config = new File(directory, 'config/iris.properties')
            config.parentFile.mkdirs()
            config.text = "enableShaders=true\nshaderPack=${shader.name}\n"
        }
    }
}

java {
    toolchain.languageVersion = JavaLanguageVersion.of(25)
    withSourcesJar()
}
tasks.withType(JavaCompile).configureEach { options.release = 25 }
test { useJUnitPlatform() }
processResources {
    inputs.property 'version', project.version
    filesMatching('fabric.mod.json') { expand version: project.version }
}
tasks.withType(Jar).configureEach {
    from('LICENSE', 'COPYING', 'COPYING.LESSER')
}

// A separate, opt-in test mod for checking the release jar in a real launcher.
// Never distribute this jar to players: it creates and controls disposable test worlds.
tasks.register('clientTestJar', Jar) {
    dependsOn tasks.named('gametestClasses')
    archiveClassifier = 'client-tests'
    destinationDirectory = layout.buildDirectory.dir('testmods')
    from sourceSets.gametest.output
}
