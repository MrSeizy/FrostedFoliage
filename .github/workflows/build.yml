name: Build

on:
  push:
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 25
      - uses: gradle/actions/setup-gradle@v4
      # Runs the unit tests and builds the mod jar. `build` skips the game-test source set, so compile it explicitly;
      # running the client game tests needs a display, so they run locally.
      - run: ./gradlew build compileGametestJava
      - uses: actions/upload-artifact@v4
        with:
          name: frostedfoliage-jar
          path: build/libs/*.jar
