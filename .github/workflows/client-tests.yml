name: Client tests

# Nightly and on demand. Minecraft 26.3's client runs without a display server on the hosted runners (Fabric's own
# CI does the same): no Xvfb and Mesa software rendering. OpenGL is requested through options.txt, but without an X
# server the client finds no GLX visual and falls back to the Vulkan backend (lavapipe); the fixtures pass there.
on:
  schedule:
    - cron: '0 5 * * *'
  workflow_dispatch:

jobs:
  client:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    strategy:
      fail-fast: false
      matrix:
        renderer: [vanilla, sodium]
        scenario: [default, rebuildTest, tornTest, groundTest]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 25
      - uses: gradle/actions/setup-gradle@v4
      - run: sudo apt-get update && sudo apt-get install -y mesa-vulkan-drivers
      - name: Select the OpenGL backend
        run: |
          mkdir -p build/run/clientGameTest
          echo 'preferredGraphicsBackend:"opengl"' >> build/run/clientGameTest/options.txt
      - name: Run ${{ matrix.scenario }} with ${{ matrix.renderer }}
        run: |
          FLAG=""
          if [ "${{ matrix.scenario }}" != "default" ]; then FLAG="-P${{ matrix.scenario }}=true"; fi
          # A client that cannot open a window hangs rather than exits; bound the run.
          timeout 25m ./gradlew runClientGameTest --stacktrace -PtestRenderer=${{ matrix.renderer }} $FLAG
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: client-${{ matrix.renderer }}-${{ matrix.scenario }}
          path: |
            build/run/clientGameTest/screenshots
            build/run/clientGameTest/logs
          if-no-files-found: ignore
