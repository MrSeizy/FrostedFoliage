name: Client tests

# Nightly and on demand: the client game tests need a display and a GPU driver, so they run under Xvfb with
# Mesa's software renderer. Unverified on the hosted runners as of 2026-10-26; expect to tune timeouts.
on:
  schedule:
    - cron: '0 5 * * *'
  workflow_dispatch:

jobs:
  client:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix:
        renderer: [vanilla, sodium]
        scenario: [default, rebuildTest, tornTest, groundTest]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 25
      - uses: gradle/actions/setup-gradle@v4
      - run: sudo apt-get update && sudo apt-get install -y xvfb mesa-utils libgl1-mesa-dri
      - name: Run ${{ matrix.scenario }} with ${{ matrix.renderer }}
        env:
          LIBGL_ALWAYS_SOFTWARE: '1'
        run: |
          FLAG=""
          if [ "${{ matrix.scenario }}" != "default" ]; then FLAG="-P${{ matrix.scenario }}=true"; fi
          xvfb-run --auto-servernum --server-args='-screen 0 1280x800x24' \
            ./gradlew runClientGameTest -PtestRenderer=${{ matrix.renderer }} $FLAG
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: client-${{ matrix.renderer }}-${{ matrix.scenario }}
          path: |
            build/run/clientGameTest/screenshots
            build/run/clientGameTest/logs
          if-no-files-found: ignore
